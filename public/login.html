<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Gestión Departamento de Tutorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 20px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .card-header {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 20px;
            border-bottom: 5px solid #0d6efd;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
            width: 100%;
            padding: 10px;
            font-weight: 500;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0b5ed7;
        }
        .btn-guest {
            border: 1px solid #6c757d;
            color: #6c757d;
        }
        .btn-guest:hover {
            background-color: #f8f9fa;
        }
        .alert {
            display: none;
            margin-top: 15px;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #dee2e6;
        }
        .divider-text {
            padding: 0 10px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">Iniciar Sesión</h3>
                <p class="mb-0">Sistema de Gestión Departamento de Tutorias</p>
            </div>
            <div class="card-body p-4">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nombre de Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                </form>

                <div class="divider">
                    <span class="divider-text">o</span>
                </div>

                <button id="guestLoginBtn" class="btn btn-guest w-100">
                    <i class="bi bi-person-circle"></i> Entrar como Invitado
                </button>

                <div class="alert alert-danger mt-3" id="errorAlert" role="alert"></div>
                <div class="alert alert-info mt-3" id="infoAlert" role="alert" style="display: none;">
                    <i class="bi bi-info-circle"></i> Modo demo: acceso de solo lectura
                </div>
                
                <div class="text-center mt-3">
                    <p>¿No tienes una cuenta? <a href="/register">Regístrate</a></p>
                    <p><a href="/">Volver al Inicio</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Mantener todo el HTML existente hasta el script -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Verificar si ya está autenticado
        const token = localStorage.getItem('token');
        if (token) {
            fetch('/api/auth/verify', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.user.role === 'admin' 
                        ? '/admin/dashboard' 
                        : '/user/dashboard';
                }
            });
        }

        // Manejo del formulario de login
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const errorAlert = document.getElementById('errorAlert');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Error en la autenticación');
                }

                const data = await response.json();
                
                if (data.token && data.user) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirección basada en el rol
                    const redirectPath = data.user.role === 'admin' 
                        ? '/admin/dashboard' 
                        : '/user/dashboard';
                    window.location.href = redirectPath;
                }
            } catch (error) {
                errorAlert.textContent = error.message;
                errorAlert.style.display = 'block';
                console.error('Error:', error);
            }
        });

        // Login como invitado (opcional)
        document.getElementById('guestLoginBtn').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('infoAlert').style.display = 'block';
            
            fetch('/api/auth/guest-login', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Error al acceder como invitado');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('Error al conectar con el servidor');
            });
        });

        function showError(message) {
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
            document.getElementById('infoAlert').style.display = 'none';
        }
    });
</script>

</body>
</html>
