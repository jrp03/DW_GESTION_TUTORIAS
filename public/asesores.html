<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asesores | Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --dark-color: #2b2d42;
            --light-color: #f8f9fa;
            --success-color: #4cc9f0;
            --warning-color: #f8961e;
            --danger-color: #f72585;
        }
        
        body {
            background-color: #f5f7ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.25);
            transform: translateY(-5px);
        }
        
        .navbar-glass {
            background: rgba(67, 97, 238, 0.85) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 12px 15px;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(72, 149, 239, 0.25);
        }
        
        .btn-modern {
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            position: relative;
            overflow: hidden;
        }
        
        .btn-modern::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-100%);
            transition: all 0.3s;
        }
        
        .btn-modern:hover::after {
            transform: translateX(0);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
        }
        
        .btn-success {
            background-color: var(--success-color);
        }
        
        .btn-warning {
            background-color: var(--warning-color);
        }
        
        .btn-danger {
            background-color: var(--danger-color);
        }
        
        .btn-secondary {
            background-color: #6c757d;
        }
        
        .table-modern {
            --bs-table-bg: transparent;
            --bs-table-striped-bg: rgba(67, 97, 238, 0.05);
            --bs-table-hover-bg: rgba(67, 97, 238, 0.1);
        }
        
        .table-modern thead {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .floating-label {
            position: relative;
            margin-bottom: 20px;
        }
        
        .floating-label label {
            position: absolute;
            top: 12px;
            left: 15px;
            color: #6c757d;
            transition: all 0.3s;
            pointer-events: none;
            background: white;
            padding: 0 5px;
        }
        
        .floating-label input:focus + label,
        .floating-label input:not(:placeholder-shown) + label,
        .floating-label select:focus + label,
        .floating-label select:not([value=""]) + label {
            top: -10px;
            left: 10px;
            font-size: 12px;
            color: var(--primary-color);
            background: rgba(255, 255, 255, 0.9);
        }
        
        #Respuesta {
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            display: none;
        }
        
        .section-title {
            position: relative;
            padding-bottom: 10px;
            margin-bottom: 30px;
            color: var(--dark-color);
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <!-- Navbar Moderno -->
    <nav class="navbar navbar-glass navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="fas fa-user-graduate me-2"></i>
                <span class="fw-bold">Sistema Académico</span>
            </a>
            <div class="d-flex align-items-center">
                <div class="avatar me-3" id="userAvatar">U</div>
                <button id="logoutBtn" class="btn btn-outline-light">
                    <i class="fas fa-sign-out-alt me-1"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <!-- Tarjeta de Formulario -->
                <div class="glass-card p-4 p-md-5 mb-5">
                    <h2 class="section-title">Registro de Asesores</h2>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="floating-label">
                                <input class="form-control" type="text" id="id_alumno" placeholder=" ">
                                <label for="id_alumno">ID Alumno</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="floating-label">
                                <input class="form-control" type="text" id="nombre" placeholder=" ">
                                <label for="nombre">Nombre</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="floating-label">
                                <input class="form-control" type="text" id="apellido" placeholder=" ">
                                <label for="apellido">Apellido</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="floating-label">
                                <input class="form-control" type="text" id="telefono" placeholder=" ">
                                <label for="telefono">Teléfono</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="floating-label">
                                <input class="form-control" type="email" id="correo" placeholder=" ">
                                <label for="correo">Correo Electrónico</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="floating-label">
                                <select class="form-select" id="maestro">
                                    <option value="" disabled selected>Seleccione un maestro</option>
                                </select>
                                <label for="maestro">Maestro Asignado</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="floating-label">
                                <select class="form-select" id="carrera">
                                    <option value=""></option>
                                    <option value="" disabled selected>Seleccione una carrera</option>
                                    <option value="ITSE">Lic. en Ingeniería en Telecomunicaciones, Sistemas y Electrónica</option>
                                    <option value="Informatica">Lic. en Informática</option>
                                    <option value="InformaticaVirtual">Lic. en Informática (Virtual)</option>
                                </select>
                                <label for="carrera">Carrera</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="floating-label">
                                <select class="form-select" id="materia">
                                    <option value="" disabled selected>Seleccione una materia</option>
                                </select>
                                <label for="materia">Materia</label>
                            </div>
                        </div>
                        <div class="col-12 mt-4">
                            <div class="d-flex flex-wrap justify-content-center gap-3">
                                <button class="btn btn-success btn-modern" id="Guardar">
                                    <i class="fas fa-save me-2"></i>Guardar
                                </button>
                                <button class="btn btn-primary btn-modern" id="Listado">
                                    <i class="fas fa-list me-2"></i>Mostrar Listado
                                </button>
                                <button class="btn btn-warning btn-modern" id="editar">
                                    <i class="fas fa-edit me-2"></i>Editar
                                </button>
                                <button class="btn btn-danger btn-modern" id="eliminar">
                                    <i class="fas fa-trash-alt me-2"></i>Eliminar
                                </button>
                                <a href="/user/dashboard" class="btn btn-secondary btn-modern">
                                    <i class="fas fa-home me-2"></i>Inicio
                                </a>
                            </div>
                        </div>
                    </div>
                    <div id="Respuesta" class="text-center mt-4"></div>
                </div>

                <!-- Tarjeta de Listado -->
                <div class="glass-card p-4" id="DivListado" style="display: none;">
                    <h3 class="section-title">Listado de Asesores</h3>
                    <div class="table-responsive">
                        <table class="table table-modern table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>ID Alumno</th>
                                    <th>Nombre</th>
                                    <th>Apellido</th>
                                    <th>Teléfono</th>
                                    <th>Correo</th>
                                    <th>Maestro</th>
                                    <th>Carrera</th>
                                    <th>Materia</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="table-group-divider"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    $(document).ready(function() {
        // Verificar autenticación y rol
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (!token || !user.role) {
            window.location.href = '/login';
            return;
        }

        // Configurar Axios (opcional, mejor que $.ajax)
        axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;

        // Manejar logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            axios.post('/logout')
                .finally(() => {
                    localStorage.clear();
                    window.location.href = '/login';
                });
        });

        // Cargar datos iniciales
        cargarSelectores();
        mostrarListado();

        function cargarSelectores() {
           // Cargar maestros
    axios.get('/api/asesores/maestros/listado')
        .then(response => {
            const selectMaestro = document.getElementById('maestro');
            selectMaestro.innerHTML = '<option value="" disabled selected>Seleccione un maestro</option>';
            
            response.data.DATA.forEach(maestro => {
                const option = document.createElement('option');
                option.value = maestro.id_maestro;
                option.textContent = `${maestro.nombres} ${maestro.apellidos}`;
                selectMaestro.appendChild(option);
            });
        })
        .catch(error => {
            console.error('Error cargando maestros:', error);
            mostrarError('No se pudieron cargar los maestros');
        });

    // Cargar materias
   axios.get('/api/asesores/materias/listado')
        .then(response => {
            const selectMateria = document.getElementById('materia');
            selectMateria.innerHTML = '<option value="" disabled selected>Seleccione una materia</option>';
            
            response.data.DATA.forEach(materia => {
                const option = document.createElement('option');
                option.value = materia.id_materia;
                option.textContent = materia.nombre_materia;
                selectMateria.appendChild(option);
            });
        })
        .catch(error => {
            console.error('Error cargando materias:', error);
            mostrarError('No se pudieron cargar las materias');
        });
        }
        // Guardar nuevo asesor
        $("#Guardar").click(function() {
            const datos = {
                id_alumno: $("#id_alumno").val(),
                nombre: $("#nombre").val(),
                apellido: $("#apellido").val(),
                telefono: $("#telefono").val(),
                correo: $("#correo").val(),
                maestro: $("#maestro").val(),
                carrera: $("#carrera").val(),
                materia: $("#materia").val()
            };

            axios.post('/api/asesores', datos)
                .then(response => {
                    mostrarMensaje('success', 'Asesor guardado correctamente');
                    mostrarListado();
                    limpiarFormulario();
                })
                .catch(error => mostrarError('Error guardando asesor', error));
        });

        // Mostrar listado de asesores
        function mostrarListado() {
            $("#DivListado").slideDown();
            axios.get('/api/asesores')
                .then(response => {
                    const asesores = response.data.DATA || [];
                    const html = asesores.length > 0 
                        ? asesores.map((asesor, index) => `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${asesor.id_alumno || ''}</td>
                                <td>${asesor.nombre || ''}</td>
                                <td>${asesor.apellido || ''}</td>
                                <td>${asesor.telefono || ''}</td>
                                <td><a href="mailto:${asesor.correo || ''}">${asesor.correo || ''}</a></td>
                                <td>${asesor.nombre_maestro || ''}</td>
                                <td><span class="badge bg-primary">${asesor.carrera || ''}</span></td>
                                <td>${asesor.nombre_materia || ''}</td>
                            </tr>`
                        ).join('')
                        : `<tr><td colspan="9" class="text-center py-4 text-muted">
                            <i class="fas fa-info-circle me-2"></i>No hay registros
                        </td></tr>`;
                    $("#tableBody").html(html);
                })
                .catch(error => mostrarError('Error cargando listado', error));
        }

        // Editar asesor
        $("#editar").click(function() {
            let id_alumno = $("#id_alumno").val();
            if (!id_alumno) {
                id_alumno = prompt("Ingrese ID del alumno a editar:");
                if (!id_alumno) return;
            }

            const datos = {
                nombre: $("#nombre").val(),
                apellido: $("#apellido").val(),
                telefono: $("#telefono").val(),
                correo: $("#correo").val(),
                maestro: $("#maestro").val(),
                carrera: $("#carrera").val(),
                materia: $("#materia").val()
            };

            axios.put(`/api/asesores/${id_alumno}`, datos)
                .then(response => {
                    mostrarMensaje('success', 'Asesor actualizado');
                    mostrarListado();
                })
                .catch(error => mostrarError('Error editando asesor', error));
        });

        // Eliminar asesor
        $("#eliminar").click(function() {
            let id_alumno = $("#id_alumno").val();
            if (!id_alumno) {
                id_alumno = prompt("Ingrese ID del alumno a eliminar:");
                if (!id_alumno) return;
            }

            if (confirm(`¿Eliminar al asesor con ID ${id_alumno}?`)) {
                axios.delete(`/api/asesores/${id_alumno}`)
                    .then(response => {
                        mostrarMensaje('success', 'Asesor eliminado');
                        mostrarListado();
                        limpiarFormulario();
                    })
                    .catch(error => mostrarError('Error eliminando asesor', error));
            }
        });

        // Funciones auxiliares
        function limpiarFormulario() {
            $("#id_alumno, #nombre, #apellido, #telefono, #correo").val('');
            $("#maestro, #carrera, #materia").val('').trigger('change');
        }

        function mostrarMensaje(tipo, mensaje) {
            const alertClass = tipo === 'success' ? 'alert-success' : 'alert-danger';
            $("#Respuesta").html(`<div class="alert ${alertClass}">${mensaje}</div>`)
                .fadeIn().delay(3000).fadeOut();
        }

        function mostrarError(mensaje) {
        const errorAlert = document.createElement('div');
        errorAlert.className = 'alert alert-danger mt-3';
        errorAlert.textContent = mensaje;
        document.body.appendChild(errorAlert);
        setTimeout(() => errorAlert.remove(), 5000);
        }
    });
</script>
</body>
</html>
