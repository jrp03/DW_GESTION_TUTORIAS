<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Maestros | Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --dark-color: #2b2d42;
            --light-color: #f8f9fa;
            --success-color: #4cc9f0;
            --warning-color: #f8961e;
            --danger-color: #f72585;
        }
        
        body {
            background-color: #f5f7ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.25);
            transform: translateY(-5px);
        }
        
        .navbar-glass {
            background: rgba(67, 97, 238, 0.85) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .navbar-logo {
            height: 32px;
            width: auto;
            transition: transform 0.3s ease;
            filter: brightness(0) invert(1);
        }
        
        .navbar-logo:hover {
            transform: scale(1.1);
        }
        
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 12px 15px;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(72, 149, 239, 0.25);
        }
        
        .btn-modern {
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            position: relative;
            overflow: hidden;
        }
        
        .btn-modern::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-100%);
            transition: all 0.3s;
        }
        
        .btn-modern:hover::after {
            transform: translateX(0);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
        }
        
        .btn-success {
            background-color: var(--success-color);
        }
        
        .btn-warning {
            background-color: var(--warning-color);
        }
        
        .btn-danger {
            background-color: var(--danger-color);
        }
        
        .btn-secondary {
            background-color: #6c757d;
        }
        
        .table-modern {
            --bs-table-bg: transparent;
            --bs-table-striped-bg: rgba(67, 97, 238, 0.05);
            --bs-table-hover-bg: rgba(67, 97, 238, 0.1);
        }
        
        .table-modern thead {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .floating-label {
            position: relative;
            margin-bottom: 20px;
        }
        
        .floating-label label {
            position: absolute;
            top: 12px;
            left: 15px;
            color: #6c757d;
            transition: all 0.3s;
            pointer-events: none;
            background: white;
            padding: 0 5px;
        }
        
        .floating-label input:focus + label,
        .floating-label input:not(:placeholder-shown) + label,
        .floating-label select:focus + label,
        .floating-label select:not([value=""]) + label {
            top: -10px;
            left: 10px;
            font-size: 12px;
            color: var(--primary-color);
            background: rgba(255, 255, 255, 0.9);
        }
        
        #Respuesta {
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            display: none;
        }
        
        .section-title {
            position: relative;
            padding-bottom: 10px;
            margin-bottom: 30px;
            color: var(--dark-color);
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-glass navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="https://cdn-icons-png.flaticon.com/512/3565/3565418.png" alt="Logo Sistema" class="navbar-logo me-2">
                <span class="fw-bold">Registro de Maestros</span>
            </a>
            <div class="d-flex align-items-center">
                <div class="avatar me-3">user</div>
                <button id="logoutBtn" class="btn btn-outline-light">
                    <i class="fas fa-sign-out-alt me-1"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <!-- Tarjeta de Formulario -->
                <div class="glass-card p-4 p-md-5 mb-5">
                    <h2 class="section-title">Gestión de Maestros</h2>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="floating-label">
                                <input class="form-control" type="text" id="id_maestro" placeholder=" ">
                                <label for="id_maestro">ID Maestro</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="floating-label">
                                <input class="form-control" type="text" id="nombres" placeholder=" ">
                                <label for="nombres">Nombres</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="floating-label">
                                <input class="form-control" type="text" id="apellidos" placeholder=" ">
                                <label for="apellidos">Apellidos</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="floating-label">
                                <select class="form-select" id="materia" required>
                                    <option value="" disabled selected>Seleccione una materia</option>
                                </select>
                                <label for="materia">Materia</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="floating-label">
                                <select class="form-select" id="carrera">
                                    <option value=""></option>
                                    <option value="" disabled selected>Selecciona una carrera</option>
                                    <option value="ITSE">Lic. en Ingeniería en Telecomunicaciones, Sistemas y Electrónica</option>
                                    <option value="Informatica">Lic. en Informática</option>
                                    <option value="InformaticaVirtual">Lic. en Informática (Virtual)</option>
                                </select>
                                <label for="carrera">Carrera</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="floating-label">
                                <input class="form-control" type="text" id="telefono" placeholder=" ">
                                <label for="telefono">Teléfono</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="floating-label">
                                <input class="form-control" type="text" id="correo" placeholder=" ">
                                <label for="correo">Correo Electrónico</label>
                            </div>
                        </div>
                        <div class="col-12 mt-4">
                            <div class="d-flex flex-wrap justify-content-center gap-3">
                                <button class="btn btn-success btn-modern" id="Guardar">
                                    <i class="fas fa-save me-2"></i>Guardar
                                </button>
                                <button class="btn btn-primary btn-modern" id="Listado">
                                    <i class="fas fa-list me-2"></i>Listado
                                </button>
                                <button class="btn btn-warning btn-modern" id="editar">
                                    <i class="fas fa-edit me-2"></i>Editar
                                </button>
                                <button class="btn btn-danger btn-modern" id="eliminar">
                                    <i class="fas fa-trash-alt me-2"></i>Eliminar
                                </button>
                                <a href="/" class="btn btn-secondary btn-modern">
                                    <i class="fas fa-home me-2"></i>Inicio
                                </a>
                            </div>
                        </div>
                    </div>
                    <div id="Respuesta" class="text-center mt-4"></div>
                </div>

                <!-- Tarjeta de Listado -->
                <div class="glass-card p-4" id="DivListado" style="display: none;">
                    <h3 class="section-title">Listado de Maestros</h3>
                    <div class="table-responsive">
                        <table class="table table-modern table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>ID Maestro</th>
                                    <th>Nombres</th>
                                    <th>Apellidos</th>
                                    <th>Materia</th>
                                    <th>Carrera</th>
                                    <th>Teléfono</th>
                                    <th>Correo</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="table-group-divider"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    $(document).ready(function() {
        // Verificar autenticación
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (!token || !user.role) {
            window.location.href = '/login';
            return;
        }

        // Configurar Axios
        axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;
        
        // Eventos
        document.getElementById('logoutBtn').addEventListener('click', logout);
        $("#Guardar").click(guardarMaestro);
        $("#Listado").click(toggleListado);
        $("#editar").click(editarMaestro);
        $("#eliminar").click(eliminarMaestro);

        // Cargar datos iniciales
        cargarDatosIniciales();

        // Funciones principales
        function cargarDatosIniciales() {
            Promise.all([
                cargarMaterias(),
                cargarCarreras()
            ]).then(() => {
                mostrarListado();
            }).catch(error => {
                console.error('Error cargando datos iniciales:', error);
                mostrarError('Error al cargar datos iniciales');
            });
        }

        function cargarMaterias() {
            return axios.get('/api/maestros/materias/listado')
                .then(response => {
                    const selectMateria = $("#materia");
                    selectMateria.empty().append(
                        $('<option>').val('').prop('disabled', true).prop('selected', true).text('Seleccione una materia')
                    );
                    
                    (response.data.DATA || []).forEach(materia => {
                        selectMateria.append(
                            $('<option>').val(materia.id_materia).text(materia.nombre_materia)
                        );
                    });
                })
                .catch(handleApiError('materias'));
        }

        function cargarCarreras() {
            return axios.get('/api/maestros/carreras/listado')
                .then(response => {
                    const selectCarrera = $("#carrera");
                    selectCarrera.empty().append(
                        $('<option>').val('').prop('disabled', true).prop('selected', true).text('Seleccione una carrera')
                    );
                    
                    (response.data.DATA || []).forEach(carrera => {
                        selectCarrera.append(
                            $('<option>').val(carrera.id_carrera).text(carrera.nombre_carrera)
                        );
                    });
                })
                .catch(handleApiError('carreras'));
        }

        function guardarMaestro() {
            const datos = obtenerDatosFormulario();
            
            if (!validarDatosMaestro(datos)) {
                return;
            }

            axios.post('/api/maestros', datos)
                .then(response => {
                    if (response.data.STATUS === "OK") {
                        mostrarMensaje('success', 'Maestro registrado exitosamente');
                        recargarDatos();
                    } else {
                        mostrarError(response.data.ERROR || 'Error al guardar');
                    }
                })
                .catch(handleApiError('guardar'));
        }

        function editarMaestro() {
            const id_maestro = obtenerIdMaestro();
            if (!id_maestro) return;

            const datos = obtenerDatosFormulario();
            
            if (!validarDatosMaestro(datos)) {
                return;
            }

            axios.put(`/api/maestros/${id_maestro}`, datos)
                .then(response => {
                    if (response.data.STATUS === "OK") {
                        mostrarMensaje('success', 'Maestro actualizado exitosamente');
                        recargarDatos();
                    } else {
                        mostrarError(response.data.ERROR || 'Error al actualizar');
                    }
                })
                .catch(handleApiError('editar'));
        }

        function eliminarMaestro() {
            const id_maestro = obtenerIdMaestro();
            if (!id_maestro) return;

            if (!confirm(`¿Está seguro de eliminar al maestro con ID ${id_maestro}?`)) {
                return;
            }

            axios.delete(`/api/maestros/${id_maestro}`)
                .then(response => {
                    if (response.data.STATUS === "OK") {
                        mostrarMensaje('success', 'Maestro eliminado exitosamente');
                        recargarDatos();
                    } else {
                        mostrarError(response.data.ERROR || 'Error al eliminar');
                    }
                })
                .catch(handleApiError('eliminar'));
        }

        // Funciones auxiliares
        function obtenerIdMaestro() {
            let id_maestro = $("#id_maestro").val();
            if (!id_maestro) {
                id_maestro = prompt("Ingrese ID del maestro:");
                if (!id_maestro) {
                    mostrarError('Debe especificar un ID válido');
                    return null;
                }
                $("#id_maestro").val(id_maestro);
            }
            return id_maestro;
        }

        function obtenerDatosFormulario() {
            return {
                nombres: $("#nombres").val().trim(),
                apellidos: $("#apellidos").val().trim(),
                id_materia: $("#materia").val(),
                id_carrera: $("#carrera").val(),
                telefono: $("#telefono").val().trim(),
                correo: $("#correo").val().trim()
            };
        }

        function validarDatosMaestro(datos) {
            if (!datos.nombres || !datos.apellidos || !datos.id_materia) {
                mostrarError('Nombre, apellido y materia son requeridos');
                return false;
            }
            return true;
        }

        function mostrarListado() {
            $("#DivListado").slideDown();
            axios.get('/api/maestros')
                .then(response => {
                    const maestros = response.data.DATA || [];
                    const tbody = $("#tableBody");
                    
                    tbody.empty();
                    
                    if (maestros.length === 0) {
                        tbody.append(`
                            <tr>
                                <td colspan="8" class="text-center py-4 text-muted">
                                    <i class="fas fa-info-circle me-2"></i>No hay registros
                                </td>
                            </tr>
                        `);
                        return;
                    }
                    
                    maestros.forEach((maestro, index) => {
                        tbody.append(`
                            <tr>
                                <td>${index + 1}</td>
                                <td>${maestro.id_maestro}</td>
                                <td>${maestro.nombres}</td>
                                <td>${maestro.apellidos}</td>
                                <td>${maestro.nombre_materia || 'N/A'}</td>
                                <td><span class="badge bg-primary">${maestro.nombre_carrera || 'N/A'}</span></td>
                                <td>${maestro.telefono || 'N/A'}</td>
                                <td><a href="mailto:${maestro.correo}">${maestro.correo || 'N/A'}</a></td>
                            </tr>
                        `);
                    });
                })
                .catch(handleApiError('listado'));
        }

        function toggleListado() {
            $("#DivListado").slideToggle();
            if ($("#DivListado").is(":visible")) {
                mostrarListado();
            }
        }

        function recargarDatos() {
            limpiarFormulario();
            mostrarListado();
        }

        function limpiarFormulario() {
            $("#id_maestro, #nombres, #apellidos, #telefono, #correo").val('');
            $("#materia, #carrera").val('').trigger('change');
        }

        function logout() {
            axios.post('/logout')
                .finally(() => {
                    localStorage.clear();
                    window.location.href = '/login';
                });
        }

        function mostrarMensaje(tipo, mensaje) {
            const alertClass = tipo === 'success' ? 'alert-success' : 'alert-danger';
            const alertDiv = $(`
                <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
                    ${mensaje}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `);
            
            $("#Respuesta").html(alertDiv).fadeIn();
            setTimeout(() => alertDiv.alert('close'), 5000);
        }

        function mostrarError(mensaje) {
            mostrarMensaje('danger', mensaje);
        }

        function handleApiError(contexto) {
            return error => {
                console.error(`Error en ${contexto}:`, error);
                const errorMsg = error.response?.data?.ERROR || 
                               error.message || 
                               `Error al procesar ${contexto}`;
                mostrarError(errorMsg);
                return Promise.reject(error);
            };
        }
    });
</script>
</body>
</html>
